# Software: every tool the owner built or co-built that is named on the CV or in a published paper. /software/ lists all
# of them by theme (file order within a theme); the homepage shows the entries marked home: true, in file order.
#   id           short unique id; anchor becomes #sw-<id>
#   name         display name
#   full_name    optional long name (shown in the small caps line)
#   description  one sentence: what the tool does
#   language     optional main language(s) (shown in the small caps line); leave empty if no public source states it
#   stack        list of technologies, from the repository (README, languages, files) or the paper (shown as tags)
#   visibility   public | private. public = the code is on GitHub and "repo" links to it; private = no public
#                repository (the page says "Code not public" and links nothing)
#   repo         repository URL, only for public entries
#   license      optional, e.g. MIT (shown as "MIT License"); leave empty if the repository states none
#   theme        research theme slug (section on /software/; the theme page may feature it)
#   home         true = also listed in the homepage Software section (keep it to three)
#   drawing      optional project drawing shown with the entry: orbit | medical | obxml | ifcjson
#                (src/components/diagrams/Project<Name>.astro)
#   image        optional image inside public/, e.g. images/videos/<youtube>.jpg (the owner's interface screenshots);
#                used when there is no drawing. image_alt describes it.
#   image_alt    alternative text for image
#   caption      optional caption for the drawing or image
#   papers       optional publication ids (publications.yml) that describe the tool, linked as "Paper:"
#   video        optional video id (videos.yml), linked to its player on the theme page
#   credit       optional sentence on what it builds on (theme page)
#   features     optional list of { label, text } (theme page)
#
# Example:
# - id: newtool
#   name: NewTool
#   description: What it does, in one sentence.
#   language: Python
#   stack: [Python, Brick Schema]
#   visibility: public
#   repo: https://github.com/JChung-Research/newtool
#   license: MIT
#   theme: interoperable-digital-twins
#   home: false
#   papers: [eb2027]

# ---------- Grid-Interactive Efficient Buildings ----------

- id: orbit
  name: ORBIT
  full_name: ORNL Building Interactive Toolkit
  description: Open-source, scalable software platform for building energy management in small and medium-sized commercial buildings.
  language: TypeScript
  stack: [Next.js, React, TypeScript, Python, VOLTTRON, GraphQL, Prisma, Docker, BACnet, Modbus, Brick Schema]
  visibility: public
  repo: https://github.com/JChung-Research/ornl-building-interactive-toolkit
  license: Apache-2.0
  theme: grid-interactive-efficient-buildings
  home: true
  drawing: orbit
  caption: A chart configuration in the ORBIT example YAML file and the chart the web interface renders from it.
  papers: [sb2026, tm4715]
  credit: Built on PNNL's VOLTTRON middleware and AEMS framework, and extended at ORNL.
  features:
    - label: Devices
      text: Vendor-agnostic device integration over BACnet and Modbus.
    - label: Interface
      text: A configuration-driven web application for real-time monitoring, time-series visualization and supervisory control.
    - label: Configuration
      text: Automated configuration from a single semantic building model.
    - label: Deployment
      text: Containerized with Docker Compose.

# ---------- Interoperable Digital Twins ----------

- id: case-dashboard
  name: CASE dashboard
  description: Web dashboard of the ifcJSON-based monitoring platform, showing real-time sensor data on the 3D BIM model of a university laboratory.
  language: JavaScript
  stack: [JavaScript, Three.js, Chart.js, Bootstrap, jQuery, ifcJSON]
  visibility: public
  repo: https://github.com/JChung-Research/case-dashboard
  license: MIT
  theme: interoperable-digital-twins
  home: false
  image: images/videos/zWMlJOSf1o0.jpg
  image_alt: "The CASE dashboard: a 3D BIM model of the laboratory with sensor labels, beside panels for visualization options, real-time temperature and humidity gauges, data records, object types and a data table."
  caption: The dashboard in the video linked from the ICCCBE 2024 paper.
  papers: [icccbe2024]
  video: case-dashboard
  credit: The dashboard is the application layer of the platform; the other three layers are described in the paper.
  features:
    - label: Sensor layer
      text: Ambient, desk occupancy and proximity sensors in the laboratory.
    - label: Network layer
      text: LoRaWAN and Zigbee gateways forward the readings in real time to a Node-RED server.
    - label: Middleware layer
      text: The server stores the readings in MongoDB and serves them over an HTTP API; the Revit model becomes ifcJSON linked data with Brick and ifcOWL terms.
    - label: Application layer
      text: The dashboard renders the BIM model with Three.js and shows the live data in gauges and line charts.

