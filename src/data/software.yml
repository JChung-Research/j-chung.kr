  theme: interoperable-digital-twins
  home: false

# ---------- Human-Building Interaction ----------

- id: gbobxml
  name: gb-obXML Converter
  description: Translates gbXML to obXML so that occupant behavior models can enter BIM-to-BEM simulation workflows.
  language: Python, XSLT
  stack: [Python, XSLT, lxml, xmlschema, gbXML v7.04, obXML v1.4]
  visibility: public
  repo: https://github.com/JChung-Research/gb-obXML-Converter
  license: MIT
  theme: human-building-interaction
  home: true
  drawing: obxml
  caption: The obXML v1.4 schema tree, with the elements new in v1.4 and the elements the converter fills from gbXML.
  papers: [bs2025]
  features:
    - label: Validate
      text: Checks the input file against the gbXML v7.04 schema.
    - label: Transform
      text: Maps gbXML elements to obXML elements with XSLT rules kept apart from the code.
    - label: Check
      text: Validates the generated file against the obXML v1.4 schema.
    - label: Reuse
      text: Runs from the command line; its core module can be built into other Python applications.

- id: pyobfmu
  name: obFMU in Python
  description: Python version of obFMU, the C++ occupant behavior simulator, for integration with data-driven occupant behavior modeling and BIM.
  language: Python
  stack: [Python, obXML, Functional Mockup Unit]
  visibility: private
  theme: human-building-interaction
  home: false

