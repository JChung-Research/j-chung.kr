# Who the site is about. Used by the header, the homepage hero, the footer, the CV page,
# and the SEO tags (title, Open Graph, JSON-LD Person).
# Text here must trace to canonical-facts.md or the latest CV (see CLAUDE.md).

name: Jihoon Chung
suffix: Ph.D.                     # shown light grey after the name
citation_name: "Chung, J."        # in publications.yml, the author string equal to this is set in bold

# Homepage headline: each term stays on one line (never broken inside a term).
headline:
  - Building Science
  - Building Informatics
  - Computational Design

role:
  title: Postdoctoral Research Associate
  group: Grid-interactive Controls Group
  organization: Oak Ridge National Laboratory
  since: 2025-05                  # YYYY-MM

# Homepage lede (the bio sentences under the role line).
bio: >-
  I design and build the digital tools that connect buildings, grids and the people inside them.
  I draw the system diagrams, write the software, and design the interfaces that make building data usable.

# Search-engine description of the homepage.
description: "Building science researcher: interoperable digital twins, grid-interactive efficient buildings, and human-building interaction."

# Contact form on /contact/: the owner's original Formspree form from the old site (same form ID, fields, subject
# line and spam trap). No email address appears anywhere on the site; Formspree keeps the delivery address in the
# owner's account. The form has Formspree's reCAPTCHA on, so it posts the normal way (Formspree shows the check and
# its thank-you page), exactly as on the old site.
#   provider   formspree
#   key        the Formspree form ID (the part after formspree.io/f/). Empty = the page shows a short note instead.
contact_form:
  provider: formspree
  key: mlepyzqv

