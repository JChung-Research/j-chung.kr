# Publications: everything published or formally released (the CV's journal, conference, abstract, patent and article
# sections, plus the OSTI technical reports). Work in progress, submitted or under review is never listed.
# Any order; pages sort newest first (year, then month) and group by type.
#
#   id         short unique id; the entry's anchor becomes #p-<id> (e.g. #p-sb2026)
#   type       journal | conference | report | abstract | article | patent
#              (groups on /publications/, in that order: Journal articles, Conference papers, Technical reports,
#              Abstracts, Articles, Patents)
#   title      as published (patents: the CV's exact wording)
#   authors    list in citation form; the entry equal to profile.yml "citation_name" ("Chung, J.")
#              is set in bold. End the list with "et al." to shorten it. Patents: the inventors, as on the CV.
#   venue      journal or proceedings name (set in italics). Patents: the CV's number line, e.g.
#              "Application Serial No. US20250238578A1" (not italic).
#   place      optional, conference city, or a patent's country (shown after the venue)
#   publisher  optional, shown after the venue when there is no place (e.g. for reports)
#   year       journals: issue year; proceedings and abstracts: the year the work was presented at the meeting
#              (as on the CV; Springer and ASCE volumes can carry the following year); reports: OSTI release date;
#              patents: publication or grant year
#   month      optional, 1 to 12, on the same rule (theme pages and /publications/ show "May 2026")
#   volume, issue, pages, number   optional; number = article number (e.g. 116367)
#   doi        DOI without "https://doi.org/"
#   pdf        optional full URL of an open-access PDF (checked to answer 200 with a PDF)
#   code       optional full URL of a code repository
#   link       optional { url, label } for entries without a DOI (patent page, NTRS record, blog post), shown
#              as "[label]"
#   bibtex     citation key
#   short      short label used in "Paper:" links (e.g. "SimBuild 2026")
#   themes     research theme slugs: interoperable-digital-twins, grid-interactive-efficient-buildings,
#              human-building-interaction (the entry is listed on those theme pages)
#   selected   true = eligible for "Selected publications" on the homepage (the newest three are shown)
#
# Example:
# - id: eb2027
#   type: journal
#   title: Title of the paper
#   authors: ["Chung, J.", "Coauthor, A."]
#   venue: Energy and Buildings
#   year: 2027
#   volume: 350
#   number: 116000
#   doi: 10.1016/j.enbuild.2027.116000
#   bibtex: chung2027energy
#   short: Energy and Buildings 2027
#   themes: [grid-interactive-efficient-buildings]
#   selected: false
#
# Every entry was checked against the paper or report and against Crossref (or the publisher's record where Crossref
# has none) on 2026-11-01; differences from the CV are listed in
# personal-website/research/compare-2026-11-01-stage2/source-check.md.

