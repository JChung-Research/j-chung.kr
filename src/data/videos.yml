# Videos: the owner's own YouTube uploads. Each plays in the "Demo" section of its theme page, click to play: the page
# shows a local poster (public/images/videos/<youtube>.jpg, the video's YouTube thumbnail) and loads the
# privacy-enhanced YouTube player (youtube-nocookie.com) only when the visitor clicks. Without JS the poster links to
# the video on YouTube. A recent.yml entry can link to one with `video: <id>`.
#   id        short unique id; the player's anchor becomes #video-<id>
#   youtube   the YouTube video ID (the part after youtu.be/)
#   title     the video's title, as on YouTube
#   short     a few words for "Video:" links on the homepage project cards
#   length    "M:SS", in quotes
#   date      upload month "YYYY-MM", in quotes
#   line      one sentence on what the video shows, traceable to the paper or the code
#   theme     the theme page that shows it
#
# Poster for a new video: save https://i.ytimg.com/vi/<youtube>/maxresdefault.jpg as public/images/videos/<youtube>.jpg.

- id: case-dashboard
