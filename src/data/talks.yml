# Talks, posters and presentations: the CV's "Presentations & invited talks" section. Any order; pages sort newest
# first. Session chairing is service, not a talk, and is not listed here.
#   date       YYYY-MM-DD, in quotes (YYYY-MM when the day is not known; shown as "Nov 2018")
#   title      talk title, as on the CV
#   event      event or session name (set in italics)
#   organizer  optional, e.g. IBPSA-USA
#   place      optional city
#   kind       talk | invited | poster | panel | workshop. The CV's [Oral] is "talk", [Poster] is "poster"; use
#              "invited" only where the CV marks that talk as invited.
#   note       optional short fact from the CV, e.g. a prize (shown after the event)
#   link       optional URL (slides, recording or event page)
#   themes     research theme slugs (the talk appears on those theme pages)
#
# Example:
# - date: "2027-03-02"
#   title: Title of the talk
#   event: Name of the conference session
#   organizer: ASHRAE
#   place: Chicago
#   kind: talk
#   note:
#   link:
#   themes: [grid-interactive-efficient-buildings]
#
