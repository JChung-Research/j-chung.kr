# Funded projects, in the order they should be listed.
#   title       project title as on the CV
#   sponsor     funding source
#   start       YYYY-MM, in quotes
#   end         YYYY-MM, in quotes; leave empty while the project is ongoing ("to present")
#   role        always "Contributor and developer" (never lead, PI or managed; see CLAUDE.md)
#   report_doi  optional DOI of the project report; it must also be an entry in publications.yml
#   theme       research theme slug the project belongs to
#
# Example:
# - title: Name of the project
#   sponsor: DOE Building Technologies Office
#   start: "2027-01"
#   end:
#   role: Contributor and developer
#   report_doi:
#   theme: grid-interactive-efficient-buildings

