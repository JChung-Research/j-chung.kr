name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Yearly rebuild on 1 January so the footer year stays current.
    - cron: '0 6 1 1 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      # SITE_MODE=preview for the preview repository; leave unset for production (j-chung.kr).
      SITE_MODE: ${{ vars.SITE_MODE }}
      # GoatCounter site code; leave unset for no analytics.
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the site, then verifies links, the CV-printed redirects and the no-dash rule.
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
